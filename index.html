<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Ruffles - Virtual Betta Companion</title>
    
    <!-- PWA & Mobile App Settings -->
    <meta name="theme-color" content="#070814">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Ruffles">
    <meta name="mobile-web-app-capable" content="yes">
    
    <!-- Inline PWA Data Manifest -->
    <link rel="manifest" href='data:application/manifest+json,{"name":"Ruffles Virtual Betta","short_name":"Ruffles","start_url":".","display":"standalone","background_color":"#070814","theme_color":"#070814","icons":[{"src":"data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐠</text></svg>","sizes":"512x512","type":"image/svg+xml"}]}'>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #070814;
            --tank-bg: linear-gradient(180deg, #0a0d28 0%, #12153b 45%, #1d1238 100%);
            --accent-cyan: #00f5d4;
            --accent-purple: #8338ec;
            --accent-pink: #ff007f;
            --text-color: #f4f6ff;
            --glass-bg: rgba(18, 20, 48, 0.65);
            --glass-border: rgba(255, 255, 255, 0.12);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 15% 20%, rgba(131, 56, 236, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 85% 80%, rgba(255, 0, 127, 0.12) 0%, transparent 40%);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 12px;
            padding-top: max(12px, env(safe-area-inset-top));
            padding-bottom: max(12px, env(safe-area-inset-bottom));
            overflow-x: hidden;
        }

        /* Splash Screen */
        #splash {
            position: fixed;
            inset: 0;
            background: var(--bg-color);
            z-index: 999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 15px;
            transition: opacity 0.8s ease, visibility 0.8s ease;
        }

        .splash-icon {
            font-size: 3.5rem;
            animation: pulse 1.5s infinite ease-in-out;
        }

        .splash-title {
            font-size: 1.4rem;
            font-weight: 600;
            letter-spacing: 3px;
            background: linear-gradient(45deg, var(--accent-cyan), var(--accent-pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); filter: drop-shadow(0 0 10px rgba(255,0,127,0.4)); }
            50% { transform: scale(1.15); filter: drop-shadow(0 0 25px rgba(255,0,127,0.8)); }
        }

        /* Main Container */
        .container {
            width: 100%;
            max-width: 410px;
            background: var(--glass-bg);
            border-radius: 32px;
            padding: 22px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.7), inset 0 1px 1px rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            display: flex;
            flex-direction: column;
            gap: 16px;
            position: relative;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-titles h1 {
            font-size: 1.8rem;
            letter-spacing: 2px;
            font-weight: 800;
            background: linear-gradient(135deg, #ffffff 20%, var(--accent-cyan) 60%, var(--accent-pink) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
        }

        .header-titles p {
            font-size: 0.75rem;
            color: #8c93be;
            font-weight: 300;
            letter-spacing: 1px;
        }

        .audio-btn {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 14px;
            width: 42px;
            height: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1.2rem;
            color: var(--text-color);
            transition: all 0.3s ease;
        }

        .audio-btn.active {
            background: rgba(0, 245, 212, 0.15);
            border-color: var(--accent-cyan);
            box-shadow: 0 0 12px rgba(0, 245, 212, 0.3);
        }

        /* Aquarium Tank */
        .tank-wrapper {
            position: relative;
            width: 100%;
            height: 260px;
            background: var(--tank-bg);
            border-radius: 24px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: inset 0 0 40px rgba(0, 0, 0, 0.8), 0 10px 25px rgba(0, 0, 0, 0.5);
        }

        .god-rays {
            position: absolute;
            top: -50%;
            left: -20%;
            width: 140%;
            height: 200%;
            background: repeating-linear-gradient(
                75deg,
                rgba(255, 255, 255, 0.04) 0px,
                rgba(255, 255, 255, 0.04) 15px,
                transparent 15px,
                transparent 40px
            );
            pointer-events: none;
            animation: raysMove 20s infinite linear;
        }

        @keyframes raysMove {
            0% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-10px) rotate(2deg); }
            100% { transform: translateY(0) rotate(0deg); }
        }

        #particle-canvas {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 5;
        }

        /* Betta Fish Container */
        .fish-container {
            position: absolute;
            width: 140px;
            height: 95px;
            left: 32%;
            top: 32%;
            transition: left 1.4s cubic-bezier(0.25, 1, 0.5, 1), top 1.4s cubic-bezier(0.25, 1, 0.5, 1);
            cursor: pointer;
            filter: drop-shadow(0 8px 18px rgba(0,0,0,0.6));
        }

        .fish-svg {
            width: 100%;
            height: 100%;
            transform-origin: 70% 50%;
            animation: swimOrganic 3.5s infinite ease-in-out alternate;
        }

        @keyframes swimOrganic {
            0% { transform: translateY(0px) rotate(0deg) scaleY(1); }
            50% { transform: translateY(-10px) rotate(3deg) scaleY(1.02); }
            100% { transform: translateY(6px) rotate(-2deg) scaleY(0.98); }
        }

        .sleeping .fish-svg {
            animation: sleepOrganic 6s infinite ease-in-out alternate;
            filter: brightness(0.5) contrast(1.2);
        }

        @keyframes sleepOrganic {
            0% { transform: translateY(0px) rotate(-12deg); }
            100% { transform: translateY(5px) rotate(-6deg); }
        }

        /* Speech Bubble */
        .speech-bubble {
            position: absolute;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%) translateY(10px);
            width: 88%;
            background: rgba(12, 14, 35, 0.92);
            border: 1px solid rgba(131, 56, 236, 0.5);
            color: #ffffff;
            padding: 12px 16px;
            border-radius: 18px;
            font-size: 0.85rem;
            line-height: 1.45;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            opacity: 0;
            pointer-events: none;
            z-index: 10;
        }

        .speech-bubble.active {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
            pointer-events: auto;
        }

        /* Stats Cards */
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.03);
            padding: 10px 12px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .stat-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.7rem;
            margin-bottom: 6px;
            color: #9da5d1;
            font-weight: 600;
            letter-spacing: 1px;
        }

        .progress-bar {
            width: 100%;
            height: 7px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            width: 80%;
            border-radius: 10px;
            transition: width 0.5s ease;
        }

        #fill-hunger { background: linear-gradient(90deg, #ff9f1c, #ffbf69); }
        #fill-happiness { background: linear-gradient(90deg, #00f5d4, #2ec4b6); }
        #fill-energy { background: linear-gradient(90deg, #3a86ff, #7209b7); }
        #fill-missing { background: linear-gradient(90deg, #8338ec, #ff007f); }

        /* Action Buttons */
        .actions-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

        .action-btn {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 18px;
            padding: 12px 4px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            color: var(--text-color);
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .action-btn:active { transform: scale(0.92); }

        .action-btn.love-btn {
            background: linear-gradient(135deg, rgba(131, 56, 236, 0.4), rgba(255, 0, 127, 0.4));
            border: 1px solid rgba(255, 0, 127, 0.5);
            grid-column: span 4;
            flex-direction: row;
            justify-content: center;
            padding: 15px;
            font-weight: 600;
            font-size: 0.95rem;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 20px rgba(255, 0, 127, 0.25);
            margin-top: 4px;
        }

        .btn-icon { font-size: 1.3rem; }
        .btn-label { font-size: 0.7rem; color: #b4bce4; font-weight: 400; }
    </style>
</head>
<body>

    <!-- Startup Splash Screen -->
    <div id="splash">
        <div class="splash-icon">🐠</div>
        <div class="splash-title">RUFFLES</div>
    </div>

    <!-- Main Container -->
    <div class="container">
        <header>
            <div class="header-titles">
                <h1>Ruffles 🐠</h1>
                <p>YOUR VIRTUAL BETTA COMPANION</p>
            </div>
            <button class="audio-btn" id="audio-toggle" onclick="toggleAudio()" title="Toggle Sound Effects">
                🔕
            </button>
        </header>

        <!-- Aquarium Tank -->
        <div class="tank-wrapper" id="tank">
            <div class="god-rays"></div>
            <canvas id="particle-canvas"></canvas>

            <!-- Betta Fish Vector -->
            <div class="fish-container" id="fish" onclick="tapFish(event)">
                <svg class="fish-svg" viewBox="0 0 200 140" id="fish-svg">
                    <defs>
                        <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#0d1b40" />
                            <stop offset="45%" stop-color="#1f1a60" />
                            <stop offset="100%" stop-color="#4a126d" />
                        </linearGradient>
                        
                        <linearGradient id="finGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#00f5d4" stop-opacity="0.9"/>
                            <stop offset="30%" stop-color="#3a86ff" stop-opacity="0.85"/>
                            <stop offset="70%" stop-color="#8338ec" stop-opacity="0.8"/>
                            <stop offset="100%" stop-color="#ff007f" stop-opacity="0.75"/>
                        </linearGradient>

                        <filter id="glow">
                            <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
                            <feMerge>
                                <feMergeNode in="coloredBlur"/>
                                <feMergeNode in="SourceGraphic"/>
                            </feMerge>
                        </filter>
                    </defs>

                    <!-- Flowing Tail Fins -->
                    <path d="M 60 70 C 15 5, 0 35, 5 70 C 0 105, 15 135, 60 70 Z" fill="url(#finGrad)" filter="url(#glow)"/>
                    <path d="M 55 70 C 25 25, 10 45, 15 70 C 10 95, 25 115, 55 70 Z" fill="url(#finGrad)" opacity="0.7"/>
                    
                    <!-- Top & Bottom Fins -->
                    <path d="M 90 45 C 65 5, 25 10, 48 50 Z" fill="url(#finGrad)"/>
                    <path d="M 95 90 C 65 140, 35 125, 62 85 Z" fill="url(#finGrad)"/>

                    <!-- Main Body -->
                    <path d="M 55 70 C 65 38, 122 38, 148 70 C 122 102, 65 102, 55 70 Z" fill="url(#bodyGrad)"/>
                    
                    <!-- Side Fin -->
                    <path d="M 102 75 C 85 92, 75 102, 92 107 C 97 97, 107 87, 102 75 Z" fill="url(#finGrad)"/>

                    <!-- Eye -->
                    <circle cx="132" cy="63" r="5" fill="#ffffff"/>
                    <circle cx="133" cy="63" r="3" fill="#070814"/>
                    <circle cx="134" cy="62" r="1.2" fill="#ffffff"/>

                    <!-- Gill -->
                    <path d="M 120 58 Q 115 70 120 82" stroke="rgba(131, 56, 236, 0.6)" stroke-width="2" fill="none"/>
                </svg>
            </div>

            <!-- Dialogue -->
            <div class="speech-bubble" id="dialogue">
                Hey there! I'm Ruffles 💙
            </div>
        </div>

        <!-- Stats -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-header"><span>HUNGER</span><span id="val-hunger">80%</span></div>
                <div class="progress-bar"><div class="progress-fill" id="fill-hunger"></div></div>
            </div>
            <div class="stat-card">
                <div class="stat-header"><span>HAPPINESS</span><span id="val-happiness">85%</span></div>
                <div class="progress-bar"><div class="progress-fill" id="fill-happiness"></div></div>
            </div>
            <div class="stat-card">
                <div class="stat-header"><span>ENERGY</span><span id="val-energy">90%</span></div>
                <div class="progress-bar"><div class="progress-fill" id="fill-energy"></div></div>
            </div>
            <div class="stat-card">
                <div class="stat-header"><span>MISSING YOU</span><span id="val-missing">15%</span></div>
                <div class="progress-bar"><div class="progress-fill" id="fill-missing"></div></div>
            </div>
        </div>

        <!-- Actions -->
        <div class="actions-grid">
            <button class="action-btn" onclick="feedPet()">
                <span class="btn-icon">🍕</span>
                <span class="btn-label">Feed</span>
            </button>
            <button class="action-btn" onclick="playPet()">
                <span class="btn-icon">🎾</span>
                <span class="btn-label">Play</span>
            </button>
            <button class="action-btn" onclick="sleepPet()">
                <span class="btn-icon">💤</span>
                <span class="btn-label">Rest</span>
            </button>
            <button class="action-btn" onclick="tapFish(event)">
                <span class="btn-icon">✨</span>
                <span class="btn-label">Pet</span>
            </button>

            <button class="action-btn love-btn" onclick="triggerLoveNote(event)">
                <span class="btn-icon">❤️</span>
                <span>Love Note from Him</span>
            </button>
        </div>
    </div>

    <script>
        // Dismiss Splash Screen
        window.addEventListener('load', () => {
            setTimeout(() => {
                const splash = document.getElementById('splash');
                splash.style.opacity = '0';
                splash.style.visibility = 'hidden';
            }, 1200);
            registerServiceWorker();
        });

        // Offline PWA Service Worker via Blob
        function registerServiceWorker() {
            if ('serviceWorker' in navigator) {
                const swCode = `
                    self.addEventListener('install', e => e.waitUntil(self.skipWaiting()));
                    self.addEventListener('activate', e => e.waitUntil(self.clients.claim()));
                    self.addEventListener('fetch', e => e.respondWith(fetch(e.request).catch(() => caches.match(e.request))));
                `;
                const blob = new Blob([swCode], { type: 'text/javascript' });
                navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(() => {});
            }
        }

        // Clean Web Audio Synthesizer (No background noise)
        let audioCtx = null;
        let sfxEnabled = false;

        function initAudioEngine() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function toggleAudio() {
            initAudioEngine();
            const btn = document.getElementById('audio-toggle');
            sfxEnabled = !sfxEnabled;
            
            if (sfxEnabled) {
                audioCtx.resume();
                btn.innerText = '🔔';
                btn.classList.add('active');
                playChime(523.25); // Soft confirmation chime
            } else {
                btn.innerText = '🔕';
                btn.classList.remove('active');
            }
        }

        // Warm, soft bell chime with low-pass filter to remove harsh noise
        function playChime(freq = 523.25, type = 'sine') {
            if (!sfxEnabled || !audioCtx) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                const filter = audioCtx.createBiquadFilter();

                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

                // Low-pass filter to make sound smooth and warm on speakers
                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(1000, audioCtx.currentTime);

                gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.6);

                osc.connect(filter);
                filter.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start();
                osc.stop(audioCtx.currentTime + 0.6);
            } catch(e) {}
        }

        // Persistent Storage with Time Decay Calculation
        let lastTime = parseInt(localStorage.getItem('ruffles_last_time')) || Date.now();
        let currentTime = Date.now();
        let elapsedMinutes = Math.floor((currentTime - lastTime) / 60000);

        let stats = JSON.parse(localStorage.getItem('ruffles_stats')) || { hunger: 80, happiness: 85, energy: 90, missing: 15 };
        let messageIndex = parseInt(localStorage.getItem('ruffles_note_idx')) || 0;
        let isSleeping = false;

        // Apply elapsed time decay if she was away
        if (elapsedMinutes > 0) {
            stats.hunger = Math.max(10, stats.hunger - (elapsedMinutes * 0.3));
            stats.happiness = Math.max(10, stats.happiness - (elapsedMinutes * 0.25));
            stats.energy = Math.min(100, stats.energy + (elapsedMinutes * 0.2));
            stats.missing = Math.min(100, stats.missing + (elapsedMinutes * 0.4));
        }

        const loveNotes = [
            "Just a reminder that you are my twin flame ❤️",
            "I am so proud of you and amazed by how perfect you are ✨",
            "I am the luckiest man ever to be able to call you mine 👑",
            "Listen: just because you are having a bad day doesn't mean I will ever leave you 💕",
            "I really love you to the moon and back and beyond 🌙✨",
            "I am yours and only yours, don't worry about others 🔒💖",
            "Heyyyy look at you missing me, aren't you so cute? (I can see you smiling!) 😉",
            "Just because I am not around doesn't mean you shouldn't take care of yourself, I am watching you! 👀💓"
        ];

        function saveState() {
            localStorage.setItem('ruffles_stats', JSON.stringify(stats));
            localStorage.setItem('ruffles_note_idx', messageIndex);
            localStorage.setItem('ruffles_last_time', Date.now());
        }

        function updateUI() {
            document.getElementById('fill-hunger').style.width = stats.hunger + '%';
            document.getElementById('val-hunger').innerText = Math.round(stats.hunger) + '%';
            document.getElementById('fill-happiness').style.width = stats.happiness + '%';
            document.getElementById('val-happiness').innerText = Math.round(stats.happiness) + '%';
            document.getElementById('fill-energy').style.width = stats.energy + '%';
            document.getElementById('val-energy').innerText = Math.round(stats.energy) + '%';
            document.getElementById('fill-missing').style.width = stats.missing + '%';
            document.getElementById('val-missing').innerText = Math.round(stats.missing) + '%';
            saveState();
        }

        let dialogueTimeout;
        function showMessage(text) {
            const dialogue = document.getElementById('dialogue');
            dialogue.innerText = text;
            dialogue.classList.add('active');
            clearTimeout(dialogueTimeout);
            dialogueTimeout = setTimeout(() => { dialogue.classList.remove('active'); }, 6000);
        }

        // Particle Canvas Burst Engine
        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        function spawnHeartParticles(x, y) {
            for (let i = 0; i < 8; i++) {
                particles.push({
                    x: x || canvas.width / 2,
                    y: y || canvas.height / 2,
                    size: Math.random() * 10 + 8,
                    speedX: (Math.random() - 0.5) * 4,
                    speedY: -Math.random() * 3 - 1,
                    opacity: 1,
                    color: Math.random() > 0.5 ? '#ff007f' : '#00f5d4'
                });
            }
        }

        function renderParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach((p, index) => {
                p.x += p.speedX;
                p.y += p.speedY;
                p.opacity -= 0.02;

                ctx.save();
                ctx.globalAlpha = Math.max(0, p.opacity);
                ctx.fillStyle = p.color;
                ctx.font = `${p.size}px serif`;
                ctx.fillText('♥', p.x, p.y);
                ctx.restore();

                if (p.opacity <= 0) particles.splice(index, 1);
            });
            requestAnimationFrame(renderParticles);
        }
        renderParticles();

        // Actions
        function feedPet() {
            if (isSleeping) wakeUp();
            stats.hunger = Math.min(100, stats.hunger + 25);
            stats.energy = Math.min(100, stats.energy + 5);
            updateUI();
            playChime(440);
            showMessage("Ruffles gobbled up the treat! 🍣 Nom nom!");
            moveFishTo(35, 35);
        }

        function playPet() {
            if (isSleeping) wakeUp();
            if (stats.energy < 15) { showMessage("Ruffles is too tired to play right now... 😴"); return; }
            stats.happiness = Math.min(100, stats.happiness + 25);
            stats.energy = Math.max(0, stats.energy - 12);
            stats.hunger = Math.max(0, stats.hunger - 10);
            updateUI();
            playChime(659.25);
            showMessage("Ruffles does a happy splashy loop-de-loop! 🌊✨");
            spawnHeartParticles();
            moveFishTo(20 + Math.random() * 40, 20 + Math.random() * 30);
        }

        function sleepPet() {
            isSleeping = !isSleeping;
            const fish = document.getElementById('fish');
            if (isSleeping) {
                fish.classList.add('sleeping');
                stats.energy = Math.min(100, stats.energy + 40);
                updateUI();
                playChime(329.63);
                showMessage("Ruffles is resting softly near the bottom... 💤");
                moveFishTo(50, 60);
            } else { wakeUp(); }
        }

        function wakeUp() {
            isSleeping = false;
            document.getElementById('fish').classList.remove('sleeping');
        }

        function tapFish(e) {
            if (isSleeping) wakeUp();
            stats.happiness = Math.min(100, stats.happiness + 10);
            updateUI();
            playChime(523.25);
            showMessage("Ruffles wiggles happily against your fingers! 💙");
            if (e && e.clientX) {
                const rect = canvas.getBoundingClientRect();
                spawnHeartParticles(e.clientX - rect.left, e.clientY - rect.top);
            } else { spawnHeartParticles(); }
            moveFishTo(30 + Math.random() * 30, 25 + Math.random() * 30);
        }

        function triggerLoveNote(e) {
            if (isSleeping) wakeUp();
            stats.missing = Math.max(0, stats.missing - 30);
            stats.happiness = Math.min(100, stats.happiness + 20);
            updateUI();

            const note = loveNotes[messageIndex];
            messageIndex = (messageIndex + 1) % loveNotes.length;

            playChime(880);
            showMessage(note);
            spawnHeartParticles();
            moveFishTo(35, 28);
        }

        function moveFishTo(xPercent, yPercent) {
            const fish = document.getElementById('fish');
            const svg = document.getElementById('fish-svg');
            const currentLeft = parseFloat(fish.style.left) || 32;
            svg.style.transform = (xPercent < currentLeft) ? 'scaleX(-1)' : 'scaleX(1)';
            fish.style.left = xPercent + '%';
            fish.style.top = yPercent + '%';
        }

        // Live Passive Decay
        setInterval(() => {
            if (!isSleeping) {
                stats.hunger = Math.max(0, stats.hunger - 0.8);
                stats.happiness = Math.max(0, stats.happiness - 0.6);
                stats.energy = Math.max(0, stats.energy - 0.4);
                stats.missing = Math.min(100, stats.missing + 0.8);
            } else {
                stats.energy = Math.min(100, stats.energy + 2);
            }
            updateUI();

            if (!isSleeping && Math.random() > 0.5) {
                moveFishTo(15 + Math.random() * 55, 15 + Math.random() * 45);
            }
        }, 5000);

        updateUI();
    </script>
</body>
</html>
